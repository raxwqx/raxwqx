<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="344"
     viewBox="0 0 1200 344" role="img"
     aria-label="ARGENT — Symbolic Execution Engine">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57606a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#57606a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#57606a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="145%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <g transform="translate(0 8)">
  <rect y="14" width="1200" height="320" rx="16" fill="#1f2328"
        opacity="0.10" filter="url(#soft)"/>
  <rect width="1200" height="320" rx="16" fill="#ffffff"/>
  <g clip-path="url(#frame)">
    <rect y="318" width="1200" height="2" fill="url(#rule)"/>
    <rect x="52" y="122" width="3" height="68" fill="#57606a" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none"
        stroke="#d0d7de"/>

  <text x="52" y="58" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4"
        fill="#8c959f">01</text>
  <text x="1148" y="58" text-anchor="end" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="12"
        letter-spacing="2" fill="#8c959f">raxwqx/argent</text>

  <text x="80" y="162" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="62" font-weight="700"
        letter-spacing="7" fill="#1f2328">ARGENT</text>
  <text x="82" y="194" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="4.5"
        fill="#57606a">SYMBOLIC EXECUTION ENGINE</text>

  <text x="52" y="236" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#57606a">Forks at data-dependent branches, prunes infeasible paths with</text>
    <text x="52" y="262" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#57606a">z3, and replays every reported input concretely.</text>
  <text x="52" y="298" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1"
        fill="#57606a"><tspan fill="#57606a">&#183;</tspan>  Python    <tspan fill="#57606a">&#183;</tspan>  z3    <tspan fill="#57606a">&#183;</tspan>  SMT    <tspan fill="#57606a">&#183;</tspan>  32-bit ISA</text>

  <text x="1148" y="298" text-anchor="end" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="11"
        letter-spacing="2.5" fill="#8c959f">OPEN REPOSITORY &#8599;</text>

  <g opacity="0.9">
    <text x="860" y="118" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#afb8c1">4d 5a 90 00 03 00 00 00</text>
    <text x="860" y="148" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#8c959f">04 00 00 00 ff ff 00 00</text>
    <text x="860" y="178" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#8c959f">b8 00 00 00 00 00 00 00</text>
    <text x="860" y="208" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#8c959f">40 00 00 00 00 00 00 00</text>
    <rect x="882" y="105" width="19" height="17" rx="3" fill="#8c959f" fill-opacity="0.08" stroke="#8c959f" stroke-opacity="0.45"/>
  </g>
  </g>
</svg>
