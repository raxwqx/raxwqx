<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320"
     viewBox="0 0 1200 320" role="img"
     aria-label="ARGENT — Symbolic Execution Engine">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d1d9" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#c9d1d9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c9d1d9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0d1117"/>
  <g clip-path="url(#frame)">
    <rect y="318" width="1200" height="2" fill="url(#rule)"/>
    <rect x="52" y="122" width="3" height="68" fill="#c9d1d9" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none"
        stroke="#30363d"/>

  <text x="52" y="58" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4"
        fill="#6e7681">01</text>
  <text x="1148" y="58" text-anchor="end" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="12"
        letter-spacing="2" fill="#6e7681">raxwqx/argent</text>

  <text x="80" y="162" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="62" font-weight="700"
        letter-spacing="7" fill="#e6edf3">ARGENT</text>
  <text x="82" y="194" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="4.5"
        fill="#8b949e">SYMBOLIC EXECUTION ENGINE</text>

  <text x="52" y="236" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b949e">Forks at data-dependent branches, prunes infeasible paths with</text>
    <text x="52" y="262" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b949e">z3, and replays every reported input concretely.</text>
  <text x="52" y="298" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1"
        fill="#8b949e"><tspan fill="#c9d1d9">&#183;</tspan>  Python    <tspan fill="#c9d1d9">&#183;</tspan>  z3    <tspan fill="#c9d1d9">&#183;</tspan>  SMT    <tspan fill="#c9d1d9">&#183;</tspan>  32-bit ISA</text>

  <text x="1148" y="298" text-anchor="end" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="11"
        letter-spacing="2.5" fill="#6e7681">OPEN REPOSITORY &#8599;</text>

  <g opacity="0.9">
    <text x="860" y="118" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#484f58">4d 5a 90 00 03 00 00 00</text>
    <text x="860" y="148" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#6e7681">04 00 00 00 ff ff 00 00</text>
    <text x="860" y="178" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#6e7681">b8 00 00 00 00 00 00 00</text>
    <text x="860" y="208" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#6e7681">40 00 00 00 00 00 00 00</text>
    <rect x="882" y="105" width="19" height="17" rx="3" fill="#6e7681" fill-opacity="0.08" stroke="#6e7681" stroke-opacity="0.45"/>
  </g>
</svg>
