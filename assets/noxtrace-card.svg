  <text x="1148" y="62" text-anchor="end" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="12"
        letter-spacing="2" fill="#6e7681">raxwqx/NOXTRACE</text>

  <text x="80" y="170" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="62" font-weight="700"
        letter-spacing="7" fill="url(#steel)">NOXTRACE</text>
  <text x="82" y="202" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="4.5"
        fill="#6e7681">MULTI-ENGINE SECURITY WORKSTATION</text>

  <text x="52" y="228" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">Network reconnaissance, web inspection, source analysis and digital</text><text x="52" y="252" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8b949e">investigation in one workflow.</text>
  <text x="52" y="282" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1"
        fill="#6e7681"><tspan fill="#58a6ff">&#183;</tspan>  Python    <tspan fill="#58a6ff">&#183;</tspan>  Go    <tspan fill="#58a6ff">&#183;</tspan>  Rust    <tspan fill="#58a6ff">&#183;</tspan>  C</text>

  <g opacity="0.9">
    <circle cx="1036" cy="158" r="30" fill="none" stroke="#58a6ff" stroke-opacity="0.2" stroke-width="1"/><circle cx="1036" cy="158" r="58" fill="none" stroke="#58a6ff" stroke-opacity="0.16" stroke-width="1"/><circle cx="1036" cy="158" r="86" fill="none" stroke="#58a6ff" stroke-opacity="0.1" stroke-width="1"/><path d="M1036 158 L1122 108" stroke="#58a6ff" stroke-opacity="0.55" stroke-width="1"/><path d="M1036 158 A86 86 0 0 0 1110 202 Z" fill="#58a6ff" fill-opacity="0.06"/><circle cx="1068" cy="132" r="2.2" fill="#58a6ff" fill-opacity="0.9"/><circle cx="992" cy="170" r="2.2" fill="#58a6ff" fill-opacity="0.7"/><circle cx="1046" cy="212" r="2.2" fill="#58a6ff" fill-opacity="0.5"/>
  </g>
  <text x="1148" y="274" text-anchor="end" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="18"
