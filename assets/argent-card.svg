      <text x="52" y="236" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b949e">Forks at data-dependent branches, prunes infeasible paths with</text><text x="52" y="262" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b949e">z3, and replays every reported input concretely.</text>
      <text x="52" y="288" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1"
            fill="#6e7681"><tspan fill="#c9d1d9">&#183;</tspan>  Python    <tspan fill="#c9d1d9">&#183;</tspan>  z3    <tspan fill="#c9d1d9">&#183;</tspan>  SMT    <tspan fill="#c9d1d9">&#183;</tspan>  32-bit ISA</text>

      <g opacity="0.9">
        <text x="860" y="118" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#6e7681">4d 5a 90 00 03 00 00 00</text>
<text x="860" y="148" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#8b949e">04 00 00 00 ff ff 00 00</text>
<text x="860" y="178" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#8b949e">b8 00 00 00 00 00 00 00</text>
<text x="860" y="208" font-family="Fira Code, DejaVu Sans Mono, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1" fill="#8b949e">40 00 00 00 00 00 00 00</text>
<rect x="882" y="105" width="19" height="17" rx="3" fill="#c9d1d9" fill-opacity="0.10" stroke="#8b949e" stroke-opacity="0.45"/>
      </g>
