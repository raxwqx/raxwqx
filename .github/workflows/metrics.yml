name: metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare output directory
        run: mkdir -p assets

      - name: Generate activity card
        uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics-activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: raxwqx
          base: ""
          config_timezone: Europe/Istanbul
          config_display: columns
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: no

      - name: Generate languages card
        uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: raxwqx
          base: ""
          config_timezone: Europe/Istanbul
          config_display: columns
          output_action: none
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: no

      - name: Commit and push generated cards
        run: |
          sudo mkdir -p assets
          sudo mv /metrics_renders/assets/*.svg assets/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh self-hosted metrics [skip ci]"
            git push
          fi
